name: m1a5to

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zsd2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5400:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api:
    build:
      context: ./BACKEND/api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zsd2}
      # backend używa RABBITMQ_URL (amqp://user:pass@host:port/)
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbit_user}:${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}@rabbitmq:5672/
      MEDIA_ROOT: /media/photos
    ports:
      - "8081:8000"
    volumes:
      - media_data:/media/photos

  scrapper-otodom:
    build:
      context: ./SCRAPPER
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
      API_URL: http://api:8000
    # Uwaga: ustawione na cały kraj (bez --city) i limit stron. Zmień/usuń flagi poniżej żeby scrapować inaczej.
    # Opis CLI i flag jest w repo scrappera: SCRAPPER/README.md
    command: ["otodom", "live", "--max-pages", "${SCRAPPER_MAX_PAGES:-200}"]

  scrapper-morizon:
    build:
      context: ./SCRAPPER
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
      API_URL: http://api:8000
    # Uwaga: ustawione na cały kraj (bez --city) i limit stron. Zmień/usuń flagi poniżej żeby scrapować inaczej.
    # Opis CLI i flag jest w repo scrappera: SCRAPPER/README.md
    command: ["morizon", "live", "--max-pages", "${SCRAPPER_MAX_PAGES:-200}"]

  scrapper-gratka:
    build:
      context: ./SCRAPPER
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
      API_URL: http://api:8000
    # Uwaga: ustawione na cały kraj (bez --city) i limit stron. Zmień/usuń flagi poniżej żeby scrapować inaczej.
    # Opis CLI i flag jest w repo scrappera: SCRAPPER/README.md
    command: ["gratka", "live", "--max-pages", "${SCRAPPER_MAX_PAGES:-200}"]

  scrapper-trojmiasto:
    build:
      context: ./SCRAPPER
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
      API_URL: http://api:8000
    # Uwaga: ustawione na cały kraj (bez --city) i limit stron. Zmień/usuń flagi poniżej żeby scrapować inaczej.
    # Opis CLI i flag jest w repo scrappera: SCRAPPER/README.md
    command: ["trojmiasto", "live", "--max-pages", "${SCRAPPER_MAX_PAGES:-200}"]

  scrapper:
    build:
      context: ./SCRAPPER
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
      API_URL: http://api:8000
    command: ["--help"]

  poi-worker:
    build:
      context: ./POI
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
      INPUT_QUEUE: scraper_new_offers
      OUTPUT_QUEUE: poi_results
      API_BASE_URL: http://api:8000
      AUTO_POI_SCRIPT: python_scripts/automatic_poi_query.py
      GRID_JSON: ${POI_GRID_JSON:-data/grid_test.json}
      WORKSPACE_DIR: workspace
      POI_QUERY_SCRIPT: python_scripts/poi_query.py

  ai-worker:
    build:
      context: ./AI/image_analyzer
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
      API_BASE_URL: http://api:8000
      API_TIMEOUT: 30
      # Model
      LORA_WEIGHTS_PATH: lora_models/comprehensive_lora.pth
    volumes:
      - ./AI/lora_models:/app/lora_models:ro

  fuzzy-worker:
    build:
      context: ./FUZZY
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_started
      ai-worker:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ChangeMeRabbit!}
      API_BASE_URL: http://api:8000
      # FUZZY defaultowo słucha scraper_new_offers, ale po pełnym pipeline powinien startować po AI:
      INPUT_QUEUE: ${FUZZY_INPUT_QUEUE:-image_classification_results}
      # Opcjonalne tuningi fuzzy (patrz FUZZY/score_apartments_offline.py)
      TIME_UNIT: ${FUZZY_TIME_UNIT:-seconds}
      ALPHA: ${FUZZY_ALPHA:-0.9}

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
    environment:
      # Jeśli kiedyś będziemy chcieli bez proxy, można nadpisać np. http://localhost:8081
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:5173"
    volumes:
      - ./FRONTEND:/app
      - /app/node_modules

volumes:
  postgres_data:
  rabbitmq_data:
  media_data:
